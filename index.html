
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#0b1523">

  <title>DRILLING TCMM Dashboard</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1523;
      color: white;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid #294057;
      border-top-color: #60b8ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 25px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    a {
      color: #60b8ff;
    }
  </style>
</head>

<body>

  <div>
    <h2>DRILLING TCMM</h2>

    <div class="loader"></div>

    <p>Membuka Maintenance Dashboard...</p>

    <a id="open">Buka Dashboard</a>
  </div>

  <script>
    const DASHBOARD_URL =
      "https://script.google.com/macros/s/AKfycbz5EanbNkqsqGSxoo8nOXUE0kLt2rfwBtHtwx5Hcohu0yQZVhEU4c_13Jnh8X6IKDRD/exec";

    document.getElementById("open").href =
      DASHBOARD_URL;

    window.location.replace(DASHBOARD_URL);
  </script>

</body>
</html>
